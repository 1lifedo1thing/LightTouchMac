name: Bug report
description: Something doesn't work the way it should
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Light Touch version
      description: From About Light Touch (version and build).
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Emulated device and iOS version
      description: For example "iPod touch (2nd gen), iOS 3.1.3".
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac and macOS version
      description: For example "MacBook Air M2, macOS 15.1".
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Help ▸ Export Diagnostics makes a folder of logs. Zip it and attach it here.
