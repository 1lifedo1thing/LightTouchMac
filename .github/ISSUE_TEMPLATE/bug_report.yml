name: Bug report
description: Something doesn't work the way it should
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Light Touch version and build
      description: From Light Touch ▸ About Light Touch, including the build number in parentheses. Reports without the build can't be looked into.
      placeholder: 1.0 (1447)
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Emulated device and iOS version
      description: For example "iPod touch (2nd gen), iOS 3.1.3".
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac and macOS version
      description: For example "MacBook Air M2, macOS 15.1".
    validations:
      required: true
  - type: textarea
    id: info
    attributes:
      label: Light Touch info
      description: Choose Help ▸ Copy Bug Report Info in Light Touch, then paste here. It names the build, your Mac and the device's setup, with no personal details. Required.
      placeholder: Paste the block here.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Help ▸ Export Diagnostics saves a zip of the logs, with personal details removed. Attach it here.
